<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
</head>
<body>
<title>Grimório de Campanhas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,500;0,700;1,500&family=Alegreya+Sans:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{
  --bg:#EDF1F0; --surface:#FBFCFC; --surface-2:#E2E9E7; --ink:#17211F; --muted:#56635F; --line:#CBD6D3;
  --accent:#1E6B64; --accent-ink:#FFFFFF; --accent-soft:#D3E7E3; --gold:#9A6B12;
  --ally:#2E7D4F; --foe:#B23A3A; --neutral:#6B6F80; --unknown:#7D63A8;
  --shadow:0 12px 40px rgba(20,40,36,.18);
  --serif:"Alegreya",Georgia,"Times New Roman",serif;
  --sans:"Alegreya Sans","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#111716; --surface:#18201F; --surface-2:#222C2A; --ink:#E4ECEA; --muted:#93A39E; --line:#2E3B38;
    --accent:#5FC1B3; --accent-ink:#0C1413; --accent-soft:#1F3632; --gold:#D9A640;
    --ally:#6BC08D; --foe:#E57373; --neutral:#A2A6B8; --unknown:#B49BDB; --shadow:0 12px 40px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#111716; --surface:#18201F; --surface-2:#222C2A; --ink:#E4ECEA; --muted:#93A39E; --line:#2E3B38;
  --accent:#5FC1B3; --accent-ink:#0C1413; --accent-soft:#1F3632; --gold:#D9A640;
  --ally:#6BC08D; --foe:#E57373; --neutral:#A2A6B8; --unknown:#B49BDB; --shadow:0 12px 40px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;padding-inline:16px;padding-bottom:96px}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--serif);font-weight:700;line-height:1.15;text-wrap:balance;margin:0}
p{margin:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto}

/* modo leitura (Firebase sem permissão) */
body.ro .adder, body.ro .camp-new, body.ro [data-act^="new-"], body.ro [data-act^="edit-"], body.ro [data-act="del"],
body.ro [data-act="place-new"], body.ro [data-act="place-set"], body.ro [data-act="map-upload"], body.ro [data-act="sample"],
body.ro [data-act="toggle-pin"], body.ro [data-act="toggle-quest"], body.ro [data-act="import"], body.ro .world-note-edit{display:none!important}
.who{font-size:13px;color:var(--muted);max-width:18ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* barra superior */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:12px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--serif);font-weight:700;font-size:20px;letter-spacing:.01em}
.brand svg{width:26px;height:26px;color:var(--accent)}
.camp-switch{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;cursor:pointer;max-width:100%;min-width:0}
.camp-switch b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
.camp-switch span{color:var(--muted);font-size:14px;white-space:nowrap}
.camp-switch:hover{border-color:var(--accent)}
.bar-actions{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mode{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.mode i{width:8px;height:8px;border-radius:50%;background:var(--accent);display:inline-block}
.mode.local i{background:var(--gold)}

/* botões */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 14px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.ghost{background:transparent}
.btn.small{padding:4px 10px;font-size:14px}
.btn.danger{color:var(--foe)}
.btn.danger.armed{background:var(--foe);border-color:var(--foe);color:#fff}
.x{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:13px;padding:2px 6px;border-radius:6px}
.x:hover{color:var(--foe)}
.x.armed{background:var(--foe);color:#fff}

/* abas */
.tabs{display:flex;gap:4px;margin-block:18px 14px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{border:0;background:transparent;padding:10px 14px;cursor:pointer;font-family:var(--serif);font-size:18px;font-weight:500;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-color:var(--accent);font-weight:700}
.tab small{font-family:var(--sans);font-size:13px;color:var(--muted);margin-left:4px;font-variant-numeric:tabular-nums}

/* mestre-detalhe */
.work{display:grid;grid-template-columns:minmax(260px,360px) minmax(0,1fr);gap:20px;align-items:start}
.pane{min-width:0}
.toolbar{display:flex;gap:8px;margin-bottom:10px}
.toolbar input,.toolbar select{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px}
.toolbar select{flex:0 0 auto}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:3px 11px;font-size:14px;cursor:pointer;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink);font-weight:500}
.items{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.item{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:10px;align-items:start;padding:10px 12px;border-radius:8px;cursor:pointer;border:1px solid transparent;width:100%;text-align:left;background:transparent}
.item:hover{background:var(--surface-2)}
.item[aria-current="true"]{background:var(--surface);border-color:var(--line)}
.item .dot{width:10px;height:10px;border-radius:50%;margin-top:7px;background:var(--neutral)}
.item b{display:block;font-weight:700;overflow-wrap:anywhere}
.item .sub{display:block;font-size:14px;color:var(--muted);overflow-wrap:anywhere}
.item .meta{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;padding-top:2px}
.num{font-family:var(--mono);font-size:13px;color:var(--accent);font-weight:700}
.dot.aliado,.disp.aliado{--c:var(--ally)} .dot.hostil,.disp.hostil{--c:var(--foe)} .dot.neutro,.disp.neutro{--c:var(--neutral)} .dot.desconhecido,.disp.desconhecido{--c:var(--unknown)}
.dot{background:var(--c,var(--neutral))!important}
.dead b{text-decoration:line-through;text-decoration-color:var(--muted)}

.detail{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:24px;min-width:0}
.detail-head{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.eyebrow{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:4px}
.detail h2{font-size:30px}
.epithet{font-family:var(--serif);font-style:italic;color:var(--muted);font-size:18px;margin-top:2px}
.actions{display:flex;gap:6px;flex-wrap:wrap}
.facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px 20px;margin:20px 0;padding:14px 0;border-block:1px solid var(--line)}
.facts div{min-width:0}
.facts dt{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.facts dd{margin:2px 0 0;overflow-wrap:anywhere}
.disp{display:inline-flex;align-items:center;gap:6px;font-weight:700;color:var(--c)}
.disp::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--c)}
.pill{display:inline-block;border-radius:999px;padding:1px 10px;font-size:13px;font-weight:700;background:var(--surface-2);color:var(--muted)}
.pill.warn{background:color-mix(in srgb,var(--foe) 16%,transparent);color:var(--foe)}
.pill.ok{background:color-mix(in srgb,var(--ally) 16%,transparent);color:var(--ally)}
.pill.gold{background:color-mix(in srgb,var(--gold) 18%,transparent);color:var(--gold)}
.prose{white-space:pre-wrap;max-width:68ch;overflow-wrap:anywhere}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.tag{font-size:13px;color:var(--accent);border:1px solid var(--accent-soft);background:var(--accent-soft);border-radius:6px;padding:0 8px}
.section-h{display:flex;align-items:baseline;gap:8px;margin:28px 0 12px}
.section-h h3{font-size:21px}
.section-h small{color:var(--muted);font-variant-numeric:tabular-nums}

.adder{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.adder textarea{width:100%;min-height:64px;resize:vertical;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:10px 12px}
.adder .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.adder select{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 10px;max-width:100%}
.adder .hint{font-size:13px;color:var(--muted);margin-right:auto}

.timeline{list-style:none;margin:0;padding:0 0 0 18px;border-left:2px solid var(--line);display:flex;flex-direction:column;gap:14px}
.timeline li{position:relative}
.timeline li::before{content:"";position:absolute;left:-24px;top:7px;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid var(--accent)}
.tl-meta{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;flex-wrap:wrap}
.tl-meta .x{margin-left:auto}
.tl-text{white-space:pre-wrap;overflow-wrap:anywhere}
.link{border:0;background:none;padding:0;color:var(--accent);cursor:pointer;font-weight:700;text-decoration:underline;text-underline-offset:2px}
.people{display:flex;gap:8px;flex-wrap:wrap}
.person{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:3px 12px 3px 8px;background:var(--bg);cursor:pointer}
.person .dot{width:8px;height:8px;border-radius:50%}

.empty{color:var(--muted);padding:24px 8px;text-align:center}
.detail-empty{border:1px dashed var(--line);border-radius:12px;padding:40px 24px;text-align:center;color:var(--muted)}
.back{display:none;margin-bottom:10px}

/* seletor de campanha */
.picker{max-width:880px;margin:40px auto 0}
.picker h1{font-size:clamp(28px,5vw,40px)}
.picker .lead{color:var(--muted);margin:10px 0 28px;max-width:62ch}
.camp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.camp{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:8px}
.camp.last{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.camp h2{font-size:22px;overflow-wrap:anywhere}
.camp .sys{font-size:14px;color:var(--muted)}
.camp .year{font-family:var(--serif);font-style:italic;font-size:16px;color:var(--gold)}
.camp .world{font-size:15px;overflow-wrap:anywhere}
.camp .row{display:flex;gap:6px;margin-top:auto;padding-top:8px;flex-wrap:wrap}
.camp-new{border:1px dashed var(--line);background:transparent;border-radius:12px;padding:18px;cursor:pointer;color:var(--muted);font-family:var(--serif);font-size:20px;min-height:150px}
.camp-new:hover{border-color:var(--accent);color:var(--accent)}
.picker-foot{margin-top:24px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;color:var(--muted);font-size:14px}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(10,18,16,.5);display:flex;align-items:flex-start;justify-content:center;padding:max(24px,env(safe-area-inset-top,0px)) 16px 24px;z-index:20;overflow-y:auto}
.modal{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);width:100%;max-width:620px;padding:22px}
.modal h2{font-size:24px;margin-bottom:16px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field.full{grid-column:1/-1}
.field label{font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.02em}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 11px;width:100%}
.field textarea{min-height:96px;resize:vertical}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}

/* dados */
.dice-fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:10;width:56px;height:56px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);box-shadow:var(--shadow);cursor:pointer;display:grid;place-items:center}
.dice-fab svg{width:30px;height:30px}
.dice{position:fixed;right:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:10;width:min(340px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:16px}
.dice h3{font-size:18px;margin-bottom:10px}
.dice form{display:flex;gap:6px}
.dice input{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 10px;font-family:var(--mono)}
.dice-quick{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.dice-quick button{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 0;cursor:pointer;font-family:var(--mono);font-size:14px}
.dice-quick button:hover{border-color:var(--accent)}
.dice-quick .wide{grid-column:span 2;font-family:var(--sans)}
.dice-result{margin-top:14px;padding:12px;border-radius:10px;background:var(--bg);text-align:center}
.dice-result .total{font-family:var(--mono);font-size:44px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.dice-result .total.crit{color:var(--gold)} .dice-result .total.fumble{color:var(--foe)}
.dice-result .break{font-family:var(--mono);font-size:13px;color:var(--muted);margin-top:6px;overflow-wrap:anywhere}
.dice-hist{list-style:none;margin:10px 0 0;padding:0;max-height:130px;overflow-y:auto;font-family:var(--mono);font-size:13px;color:var(--muted)}
.dice-hist li{display:flex;justify-content:space-between;gap:8px;padding:3px 0;border-bottom:1px solid var(--line)}
.dice-hist b{color:var(--ink)}
.dice .err{color:var(--foe);font-size:13px;margin-top:6px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;z-index:30;box-shadow:var(--shadow);max-width:calc(100vw - 32px);font-weight:500}

/* mundo */
.picker-sec{margin-top:36px}
.picker-sec:first-of-type{margin-top:0}
.picker-sec>.eyebrow{margin-bottom:10px}
.world-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 20px;align-items:center}
.world-card h2{font-size:30px;letter-spacing:.01em}
.world-card p{color:var(--muted);max-width:60ch}
.world-card .row{display:flex;gap:6px;flex-wrap:wrap}
.world-note{font-size:14px;color:var(--muted);margin:-4px 0 14px;display:flex;gap:6px;align-items:baseline}
.subtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.type-badge{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.map-layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,380px);gap:20px;align-items:start}
.map-tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.zoom{font-family:var(--mono);font-size:13px;min-width:48px;text-align:center;color:var(--muted);font-variant-numeric:tabular-nums}
.map-tools .spacer{flex:1}
.placing-bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--accent-soft);border:1px solid var(--accent);border-radius:8px;padding:8px 12px;margin-bottom:8px;font-size:15px}
.placing-bar span{flex:1;min-width:0}
.map-view{position:relative;overflow:hidden;height:min(72vh,720px);min-height:340px;border:1px solid var(--line);border-radius:12px;background:#2a2f2e;cursor:grab;touch-action:none;overscroll-behavior:contain;user-select:none;-webkit-user-select:none}
.map-view:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.map-view.dragging{cursor:grabbing}
.map-view.placing{cursor:crosshair}
.map-canvas{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
.map-canvas img{display:block;width:100%;height:100%;max-width:none;pointer-events:none}
.pin{position:absolute;transform:translate(-50%,-50%) scale(calc(1 / var(--s, 1)));border:0;background:transparent;padding:0;cursor:pointer;display:flex;align-items:center;gap:4px;z-index:1}
.map-ctl{position:absolute;z-index:3;display:grid;gap:4px}
.map-ctl button{width:36px;height:36px;border-radius:8px;border:1px solid rgba(0,0,0,.25);background:rgba(251,252,252,.94);color:#17211F;font-size:18px;line-height:1;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.35);display:grid;place-items:center;padding:0}
.map-ctl button:hover{background:#fff}
.zoom-btns{top:10px;right:10px}
.dpad{bottom:10px;left:10px;grid-template-columns:repeat(3,32px);grid-template-rows:repeat(3,32px)}
.dpad button{width:32px;height:32px;font-size:12px}
.dpad .up{grid-area:1/2}.dpad .left{grid-area:2/1}.dpad .mid{grid-area:2/2;font-size:10px}.dpad .right{grid-area:2/3}.dpad .down{grid-area:3/2}
.zoom-ctl{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.zoom-ctl input{width:150px;accent-color:var(--accent)}
.map-hint{font-size:13px;color:var(--muted);margin-top:8px}
.pin .mk{display:block;width:12px;height:12px;border-radius:50%;background:#1E6B64;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.6);flex:0 0 auto}
.pin .lb{position:absolute;left:calc(100% + 2px);top:50%;transform:translateY(-50%);white-space:nowrap;font-size:12px;font-weight:700;color:#fff;text-shadow:0 0 3px #000,0 0 2px #000,0 1px 2px #000;pointer-events:auto;cursor:pointer;padding:2px 4px;margin:-2px -4px;border-radius:4px}
.pin:hover .lb{color:#FFE9A8;background:rgba(0,0,0,.25)}
.map-view.nolabels .pin .lb{display:none}
.pin.hid{display:none}
.pin.nolb .lb{display:none}
.pin.nolb:hover .lb{display:block}
.map-view.nolabels .pin:hover .lb,.pin.sel .lb{display:block}
.pin.t-capital .mk{width:18px;height:18px;background:#1E6B64;box-shadow:0 0 0 2px #1E6B64,0 1px 5px rgba(0,0,0,.6)}
.pin.t-capital .lb{font-size:14px}
.pin.t-cidade .mk{width:14px;height:14px}
.pin.t-vila .mk{width:11px;height:11px;background:#3E8C84}
.pin.t-vilarejo .mk{width:8px;height:8px;background:#5AA79E;border-width:1.5px}
.pin.t-forte .mk{border-radius:2px;background:#8A3434;width:13px;height:13px}
.pin.t-templo .mk{border-radius:1px;background:#6A4FA0;width:11px;height:11px;transform:rotate(45deg)}
.pin.t-ruina .mk{border-radius:0;background:#fff;width:14px;height:12px;border:0;clip-path:polygon(50% 0,100% 100%,0 100%);box-shadow:none;position:relative}
.pin.t-ruina .mk::after{content:"";position:absolute;inset:2px 2.5px 1.5px;background:#4d4d4d;clip-path:polygon(50% 0,100% 100%,0 100%)}
.pin.t-natureza .mk{background:transparent;border:2.5px solid #2E7D3A;box-shadow:0 0 0 1.5px #fff,0 1px 4px rgba(0,0,0,.6)}
.pin.t-regiao .mk{display:none}

/* ---------- armazenamento ---------- */
function localStore() {
  const KEY = 'grimorio-dados-v1';
  let data = {}; try { data = JSON.parse(lsGet(KEY) || '{}'); } catch { data = {}; }
  const L = {};
  const arr = p => Object.entries(data[p] || {}).map(([id, d]) => ({id, ...d}));
  const persist = () => lsSet(KEY, JSON.stringify(data));
  const emit = p => (L[p] || []).forEach(cb => cb(arr(p), {}));
  let gone = new Set(); try { gone = new Set(JSON.parse(lsGet('grimorio-apagados') || '[]')); } catch {}
  return {
    mode: 'local',
    /* mescla um documento publicado sem apagar edições locais mais novas */
    merge(p, id, d) {
      if (gone.has(p + '/' + id)) return false;
      const cur = data[p]?.[id], t = x => String(x?.updatedAt || x?.createdAt || '');
      if (cur && t(cur) >= t(d)) return false;
      (data[p] = data[p] || {})[id] = clone(d); return true;
    },
    flush() { persist(); },
    listen(p, cb) { (L[p] = L[p] || []).push(cb); setTimeout(() => cb(arr(p), {})); return () => { L[p] = (L[p] || []).filter(x => x !== cb); }; },
    async list(p) { return arr(p); },
    async put(p, id, d) { (data[p] = data[p] || {})[id] = clone(d); if (!persist()) throw {code: 'quota_exceeded'}; emit(p); },
    async del(p, id) { if (data[p]) { delete data[p][id]; gone.add(p + '/' + id); lsSet('grimorio-apagados', JSON.stringify([...gone])); persist(); emit(p); } }
  };
}
/* dados publicados junto com o app (pasta data/ do repositório) */
async function loadPublished() {
  if (store.mode !== 'local' || !/^https?:$/.test(location.protocol)) return;
  let data;
  try { const r = await fetch('../data/grimorio.json', {cache: 'no-cache'}); if (!r.ok) return; data = await r.json(); } catch { return; }
  if (data?.app !== 'grimorio') return;
  const strip2 = d => { const c = clone(d); delete c.id; return c; };
  for (const e of data.worlds || []) {
    const w = e.world; if (!w?.id) continue;
    store.merge('worlds', w.id, strip2(w));
    for (const k of ['places', 'lore']) for (const d of e[k] || []) store.merge(`worlds/${w.id}/${k}`, d.id, strip2(d));
  }
  for (const e of data.campaigns || []) {
    const c = e.campaign; if (!c?.id) continue;
    store.merge('campaigns', c.id, strip2(c));
    for (const k of ['npcs', 'sessions', 'notes', 'placeNotes']) for (const d of e[k] || []) store.merge(`campaigns/${c.id}/${k}`, d.id, strip2(d));
  }
  store.flush(); st.published = data.exportedAt;
}
function dbStore(db) {
  return {
    mode: 'db',
    listen(p, cb, err) { return db.collection(p).onSnapshot(s => cb(s.docs.map(d => ({id: d.id, ...d.data()})), s.metadata), e => err && err(e)); },
    async list(p) { const s = await db.collection(p).get(); return s.docs.map(d => ({id: d.id, ...d.data()})); },
    put: (p, id, d) => db.collection(p).doc(id).set(d),
    del: (p, id) => db.collection(p).doc(id).delete()
  };
}
function fbStore() {
  firebase.initializeApp(window.FIREBASE_CONFIG);
  const fs = firebase.firestore();
  return {
    mode: 'firebase', fs,
    listen(p, cb, err) { return fs.collection(p).onSnapshot(s => cb(s.docs.map(d => ({id: d.id, ...d.data()})), s.metadata), e => err && err(e)); },
    async list(p) { const s = await fs.collection(p).get(); return s.docs.map(d => ({id: d.id, ...d.data()})); },
    put: (p, id, d) => fs.collection(p).doc(id).set(d),
    del: (p, id) => fs.collection(p).doc(id).delete()
  };
}
let store = null;

/* ---------- estado ---------- */
const st = {
  ready: false, screen: 'picker',

async function save(path, id, data) {
  try { await store.put(path, id, data); return true; }
  catch (e) { failMsg(e); return false; }
}
async function remove(path, id) {
  try { await store.del(path, id); return true; }
  catch (e) { failMsg(e); return false; }
}
function failMsg(e) {
  const c = e && e.code;
  if (c === 'permission-denied') toast(st.user ? 'Sua conta não tem permissão para editar. Peça ao administrador para autorizar seu e-mail.' : 'Entre com sua conta Google para editar.');
  else if (c === 'invalid_argument' || c === 'not_granted') toast('Você só tem acesso de leitura a este grimório.');
  else if (c === 'quota_exceeded') toast('O espaço de armazenamento acabou. Exclua registros antigos para continuar.');
  else toast('Não foi possível salvar. Verifique a conexão e tente de novo.');
}
let toastT;
function toast(msg) {
  const t = $('#toast'); t.innerHTML = `<div class="toast" role="status">${esc(msg)}</div>`;
  clearTimeout(toastT); toastT = setTimeout(() => t.innerHTML = '', 3400);
}

/* ---------- navegação e assinaturas ---------- */
function resetSel() {
  st.sel = {npcs: null, sessions: null, notes: null, places: null, lore: null};
  st.q = {npcs: '', sessions: '', notes: '', places: '', lore: ''};
  st.fDisp = st.fStatus = st.fCat = st.fType = st.fLore = st.fPeriod = ''; st.confirm = null; st.placing = null;
}
function subWorld(wid) {
  if (st.wid === wid && st.wsubs.length) return;
  st.wsubs.forEach(u => u()); st.wsubs = [];
  st.wid = wid; st.places = []; st.lore = []; st.loaded.places = st.loaded.lore = false;
  if (!wid) return;
  for (const k of ['places', 'lore'])
    st.wsubs.push(store.listen(`worlds/${wid}/${k}`, docs => { if (st.wid !== wid) return; st[k] = docs; st.loaded[k] = true; render(); }, () => {}));
}
function goPicker() {
  st.subs.forEach(u => u()); st.subs = []; st.cid = null;
  st.screen = 'picker'; resetSel(); window.scrollTo(0, 0); render();
}
function openWorld(wid) {
  st.subs.forEach(u => u()); st.subs = []; st.cid = null;
  st.screen = 'world'; resetSel(); st.wtab = 'mapa';
  subWorld(wid); window.scrollTo(0, 0); render();
}
function openCampaign(cid) {
  st.subs.forEach(u => u()); st.subs = [];
  st.cid = cid; st.screen = 'campaign'; st.tab = 'npcs'; st.wtab = 'mapa';
  st.npcs = []; st.sessions = []; st.notes = []; st.pnotes = [];
  for (const k of ['npcs', 'sessions', 'notes', 'pnotes']) st.loaded[k] = false;
  resetSel();
  lsSet('grimorio-ultima', cid);
  for (const [k, path] of [['npcs', 'npcs'], ['sessions', 'sessions'], ['notes', 'notes'], ['pnotes', 'placeNotes']])
    st.subs.push(store.listen(sub(path), docs => { if (st.cid !== cid) return; st[k] = docs; st.loaded[k] = true; render(); }, () => {}));
  subWorld(worldOf(curCamp())?.id || null);
  window.scrollTo(0, 0); render();
}

async function deleteCampaign(id) {
  for (const k of ['npcs', 'sessions', 'notes', 'placeNotes']) {
    const p = `campaigns/${id}/${k}`;
    try { for (const d of await store.list(p)) await store.del(p, d.id); } catch (e) { failMsg(e); return; }
  }
  if (await remove('campaigns', id)) { if (st.cid === id) goPicker(); toast('Campanha excluída.'); }
}
async function deleteWorld(id) {
  const users = st.campaigns.filter(c => worldOf(c)?.id === id);
  if (users.length) return toast(`Este mundo é usado por ${users.length} campanha(s). Troque o mundo delas ou exclua-as antes.`);
  for (const k of ['places', 'lore', 'map']) {
    const p = `worlds/${id}/${k}`;
    try { for (const d of await store.list(p)) await store.del(p, d.id); } catch (e) { failMsg(e); return; }
  }
  const w = st.worlds.find(x => x.id === id);
  if (await remove('worlds', id)) {
    if (w?.mapAsset) { try { const a = await window.claude.use('assets'); await a?.delete(w.mapAsset); } catch {} }
    if (store.mode === 'local') { try { localStorage.removeItem('grimorio-mapa-' + id); } catch {} }
    if (st.wid === id) { subWorld(null); goPicker(); }
    toast('Mundo excluído.');
  }
}

async function createSample() {
  if (!SAMPLE) return;
  const cid = uid();

/* ---------- consultas ---------- */
const sessionsSorted = () => [...st.sessions].sort((a, b) => (+b.num || 0) - (+a.num || 0));
const placeByName = name => { const k = norm(name); return k ? st.places.find(p => norm(p.name) === k) : null; };
const placeOfNpc = n => st.places.find(p => p.id === n.placeId) || placeByName(n.location);
function npcsFiltered() {
  const q = norm(st.q.npcs);
  const l = st.npcs.filter(n => (!st.fDisp || n.disp === st.fDisp) && (!st.fStatus || n.status === st.fStatus) &&
    (!q || norm([n.name, n.epithet, n.faction, n.location, n.ancestry, n.desc, (n.tags || []).join(' '), (n.entries || []).map(e => e.text).join(' ')].join(' ')).includes(q)));
  return l.sort(st.npcSort === 'recente' ? (a, b) => String(b.updatedAt || '').localeCompare(String(a.updatedAt || '')) : byName);
}
function placesFiltered() {
  const q = norm(st.q.places);
  return st.places.filter(p => (!st.fType || p.type === st.fType) &&
    (!q || norm([p.name, p.type, p.region, p.ruler, p.desc, (p.tags || []).join(' '), (p.entries || []).map(e => e.text).join(' ')].join(' ')).includes(q)))
    .sort((a, b) => (TYPE_ORDER[a.type] ?? 99) - (TYPE_ORDER[b.type] ?? 99) || byName(a, b));
}
const mapCache = {};
async function loadMapChunks(w) {
  const c = mapCache[w.id]; if (c?.loading === w.mapVer) return;
  mapCache[w.id] = {...c, loading: w.mapVer};
  try {
    const parts = (await store.list(`worlds/${w.id}/map`)).sort((a, b) => a.i - b.i);
    const bin = atob(parts.map(p => p.data).join('')); const u8 = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
    const url = URL.createObjectURL(new Blob([u8], {type: 'image/jpeg'}));
    if (c?.url) URL.revokeObjectURL(c.url);
    mapCache[w.id] = {ver: w.mapVer, url}; render();
  } catch { mapCache[w.id] = {...c, loading: null}; }
}
function mapSrc(w) {
  if (!w) return null;
  if (store?.mode === 'firebase') {
    if (w.mapChunks) { const c = mapCache[w.id]; if (c?.ver === w.mapVer) return c.url; loadMapChunks(w); }
    return w.mapFile ? '../' + w.mapFile : null;
  }
  if (store?.mode === 'db') return w.mapAsset ? '/_blob/' + w.mapAsset : null;
  return lsGet('grimorio-mapa-' + w.id) || (w.mapFile && /^https?:$/.test(location.protocol) ? '../' + w.mapFile : null);
}

/* ---------- renderização ---------- */
function swap(el, html) {
  const keep = {}, scroll = {};
  el.querySelectorAll('[data-keep]').forEach(i => keep[i.id] = i.value);
  el.querySelectorAll('[data-scroll]').forEach(i => scroll[i.id] = [i.scrollLeft, i.scrollTop]);
  const a = document.activeElement; let fid = null, sel;
  if (a && a.id && el.contains(a)) { fid = a.id; try { sel = [a.selectionStart, a.selectionEnd]; } catch {} }
  el.innerHTML = html;
  for (const id in keep) { const i = document.getElementById(id); if (i && el.contains(i)) i.value = keep[id]; }
  for (const id in scroll) { const i = document.getElementById(id); if (i) { i.scrollLeft = scroll[id][0]; i.scrollTop = scroll[id][1]; } }
  if (fid) { const f = document.getElementById(fid); if (f) { f.focus({preventScroll: true}); try { sel && f.setSelectionRange(...sel); } catch {} } }
}

}

      ${st.canEdit ? '<p>Traga para cá o mundo de Ethrü, o mapa, os lugares e as campanhas que já estão publicados no repositório.</p><p style="margin-top:10px"><button class="btn primary" data-act="seed">Trazer os dados publicados</button></p>'
        : st.user ? '<p>Sua conta ainda não pode editar. Peça ao administrador para autorizar seu e-mail.</p>' : '<p>Entre com a conta Google do administrador para começar.</p>'}</div>` : ''}
    <div class="picker-foot">${SAMPLE && store?.mode !== 'firebase' && !st.campaigns.some(c => c.example) ? '<button class="btn small ghost" data-act="sample">Criar campanha de exemplo</button><span>para ver como funciona.</span>' : ''}</div>
    </div>
    <div class="picker-sec"><p class="eyebrow">${worlds.length > 1 ? 'Mundos' : 'Mundo'}</p>
      <div style="display:flex;flex-direction:column;gap:12px">
      ${worlds.map(w => {
        const n = st.campaigns.filter(c => worldOf(c)?.id === w.id).length;
        return `<article class="world-card"><div><h2>${esc(w.name)}</h2>
          <p>${esc(w.desc || 'Localidades, mapa e lore compartilhados por todas as campanhas deste mundo.')}</p>
          <p style="font-size:14px;margin-top:6px">${n === 1 ? '1 campanha' : n + ' campanhas'} neste mundo</p></div>
          <div class="row"><button class="btn primary" data-act="open-world" data-id="${esc(w.id)}">Abrir mundo</button>
          <button class="btn small ghost" data-act="edit-world" data-id="${esc(w.id)}">Editar</button>${worlds.length > 1 ? confirmBtn('world:' + w.id) : ''}</div></article>`;
      }).join('')}
      </div>
      <div class="picker-foot" style="margin-top:10px"><button class="btn small ghost" data-act="new-world">+ Outro mundo</button></div>
    </div>
  </section>`;
}

function listHead(kind, ph, newAct, newLabel) {
  return `<div class="toolbar"><input id="q-${kind}" type="search" placeholder="${ph}" value="${esc(st.q[kind])}" data-q="${kind}" aria-label="Buscar">
    <button class="btn primary" data-act="${newAct}">${newLabel}</button></div>`;
}
function chip(key, val, lab) { return `<button class="chip" aria-pressed="${st[key] === val}" data-act="filter" data-key="${key}" data-val="${esc(val)}">${esc(lab)}</button>`; }

/* --- personalidades --- */
function viewNpcs() {
  const list = npcsFiltered(), sel = st.npcs.find(n => n.id === st.sel.npcs);
  const items = list.length ? list.map(n => `<li><button class="item${n.status === 'morto' ? ' dead' : ''}" data-act="sel" data-kind="npcs" data-id="${esc(n.id)}" aria-current="${n.id === st.sel.npcs}">
      <span class="dot ${esc(n.disp)}" title="${esc(DISP[n.disp] || '')}"></span>
      <span><b>${esc(n.name)}</b><span class="sub">${esc([n.epithet, n.faction, n.location].filter(Boolean).join(' · ') || n.kind || '')}</span></span>
      <span class="meta">${n.status && n.status !== 'vivo' ? `<span class="pill${n.status === 'morto' ? ' warn' : ''}">${esc(STATUS[n.status])}</span>` : `${(n.entries || []).length} reg.`}</span>
    </button></li>`).join('')
    : `<li class="empty">${st.npcs.length ? 'Ninguém encontrado com esses filtros.' : (st.loaded.npcs ? 'Nenhuma personalidade ainda. Adicione a primeira quando o grupo conhecer alguém importante.' : 'Carregando…')}</li>`;
  return `<div class="work${sel ? ' has-sel' : ''}">
    <section class="pane list-pane">
      ${listHead('npcs', 'Buscar nome, facção, local, registro…', 'new-npc', '+ Nova')}
      <div class="chips">${chip('fDisp', '', 'Todos')}${Object.entries(DISP).map(([k, l]) => chip('fDisp', k, l)).join('')}</div>
      <div class="chips">${chip('fStatus', '', 'Todos')}${Object.entries(STATUS).filter(([k]) => k !== 'desconhecido').map(([k, l]) => chip('fStatus', k, l)).join('')}
        <select id="npc-sort" aria-label="Ordenar" class="chip" style="margin-left:auto"><option value="nome"${st.npcSort === 'nome' ? ' selected' : ''}>A–Z</option><option value="recente"${st.npcSort === 'recente' ? ' selected' : ''}>Recentes</option></select></div>
      <ul class="items">${items}</ul>
    </section>
    <section class="pane detail-pane">${sel ? npcDetail(sel) : '<div class="detail-empty">Escolha uma personalidade para ver a ficha e os registros.</div>'}</section>
  </div>`;
}

function sessionOptions(selNum) {
  return `<option value="">Sem sessão</option>` + sessionsSorted().map(s => `<option value="${s.num}"${String(s.num) === String(selNum) ? ' selected' : ''}>Sessão ${s.num}${s.title ? ' · ' + esc(s.title) : ''}</option>`).join('');
}

function entriesHtml(list, keyPrefix, withSession = true) {
  const entries = [...(list || [])].sort((a, b) => String(b.at).localeCompare(String(a.at)));
  return entries.length ? `<ol class="timeline">${entries.map(e => `<li>
      <div class="tl-meta">${withSession ? (e.session ? `<button class="link" data-act="goto-session" data-num="${esc(e.session)}">Sessão ${esc(e.session)}</button>` : '<span>Sem sessão</span>') : ''}<span>${fmtDate(e.at)}</span>${confirmBtn(keyPrefix + e.id, '×', 'x')}</div>
      <p class="tl-text">${esc(e.text)}</p></li>`).join('')}</ol>` : '';
}

function npcDetail(n) {
  const latest = sessionsSorted()[0];
  const place = placeOfNpc(n);
  const fact = (l, v) => v ? `<div><dt>${l}</dt><dd>${v}</dd></div>` : '';
  const n_entries = (n.entries || []).length;
  return `<button class="btn small ghost back" data-act="back">← Personalidades</button>
  <article class="detail">
    <div class="detail-head"><div>
      <p class="eyebrow">${esc([n.kind, n.ancestry].filter(Boolean).join(' · '))}</p>
      <h2>${esc(n.name)}</h2>${n.epithet ? `<p class="epithet">${esc(n.epithet)}</p>` : ''}</div>
      <div class="actions"><button class="btn small" data-act="edit-npc">Editar</button>${confirmBtn('npc:' + n.id)}</div>
    </div>
    <dl class="facts">
      ${fact('Relação', `<span class="disp ${esc(n.disp)}">${esc(DISP[n.disp] || '—')}</span>`)}
      ${fact('Estado', `<span class="pill${n.status === 'morto' ? ' warn' : n.status === 'vivo' ? ' ok' : ' gold'}">${esc(STATUS[n.status] || '—')}</span>`)}
      ${fact('Facção', esc(n.faction))}
      ${fact('Local', place ? `<button class="link" data-act="goto-place" data-id="${esc(place.id)}">${esc(place.name)}</button>` : esc(n.location))}
      ${fact('Primeira aparição', n.firstSeen ? 'Sessão ' + esc(n.firstSeen) : '')}
    </dl>
    ${n.desc ? `<p class="prose">${esc(n.desc)}</p>` : '<p class="prose" style="color:var(--muted)">Sem descrição ainda.</p>'}
    ${(n.tags || []).length ? `<div class="tags">${n.tags.map(t => `<span class="tag">${esc(t)}</span>`).join('')}</div>` : ''}
    <div class="section-h"><h3>Registros</h3><small>${n_entries}</small></div>
    <form class="adder" data-form="npc-entry">
      <textarea id="entry-${esc(n.id)}" data-keep placeholder="O que aconteceu com ${esc(n.name)}? Ex.: revelou um segredo, mudou de lado, deu uma missão…"></textarea>
      <div class="row"><span class="hint">Ctrl+Enter para registrar</span><select id="entry-s-${esc(n.id)}" data-keep aria-label="Sessão">${sessionOptions(latest?.num)}</select><button class="btn primary">Registrar</button></div>
    </form>
    ${entriesHtml(n.entries, 'entry:') || '<p class="empty" style="text-align:left;padding:0">Nenhum registro. Anote aqui tudo o que o grupo descobrir sobre esta personalidade.</p>'}
  </article>`;
}

/* --- sessões --- */
function viewSessions() {
  const q = norm(st.q.sessions);
  const list = sessionsSorted().filter(s => !q || norm([s.title, s.summary, (s.log || []).map(l => l.text).join(' ')].join(' ')).includes(q));
  const sel = st.sessions.find(s => s.id === st.sel.sessions);
  const items = list.length ? list.map(s => `<li><button class="item" data-act="sel" data-kind="sessions" data-id="${esc(s.id)}" aria-current="${s.id === st.sel.sessions}" style="grid-template-columns:auto minmax(0,1fr) auto">
      <span class="num">#${esc(s.num)}</span><span><b>${esc(s.title || 'Sessão ' + s.num)}</b><span class="sub">${esc(s.worldDate || '')}</span></span><span class="meta">${fmtDate(s.date)}</span></button></li>`).join('')
    : `<li class="empty">${st.sessions.length ? 'Nada encontrado.' : (st.loaded.sessions ? 'Nenhuma sessão registrada. Comece uma no início do jogo.' : 'Carregando…')}</li>`;
  return `<div class="work${sel ? ' has-sel' : ''}">
    <section class="pane list-pane">${listHead('sessions', 'Buscar nas sessões…', 'new-session', '+ Nova sessão')}<ul class="items">${items}</ul></section>
    <section class="pane detail-pane">${sel ? sessionDetail(sel) : '<div class="detail-empty">Escolha uma sessão para ver o diário, ou comece uma nova.</div>'}</section>
  </div>`;
}

function sessionDetail(s) {
  const log = [...(s.log || [])].sort((a, b) => String(a.at).localeCompare(String(b.at)));
  const inS = e => String(e.session) === String(s.num);
  const people = st.npcs.filter(n => (n.entries || []).some(inS) || String(n.firstSeen) === String(s.num));
  const places = st.places.filter(p => st.pnotes.some(pn => pn.id === p.id && (pn.entries || []).some(inS)));
  return `<button class="btn small ghost back" data-act="back">← Sessões</button>
  <article class="detail">
    <div class="detail-head"><div><p class="eyebrow">Sessão ${esc(s.num)} · ${fmtDate(s.date)}</p><h2>${esc(s.title || 'Sem título')}</h2>${s.worldDate ? `<p class="epithet">${esc(s.worldDate)}</p>` : ''}</div>
      <div class="actions"><button class="btn small" data-act="edit-session">Editar</button>${confirmBtn('session:' + s.id)}</div></div>
    <div class="section-h"><h3>Resumo</h3></div>
    ${s.summary ? `<p class="prose">${esc(s.summary)}</p>` : '<p class="prose" style="color:var(--muted)">Sem resumo ainda. Use <b>Editar</b> para escrever ao fim da sessão.</p>'}
    <div class="section-h"><h3>Diário ao vivo</h3><small>${log.length}</small></div>
    <form class="adder" data-form="session-log">
      <textarea id="log-${esc(s.id)}" data-keep placeholder="Registre o que acabou de acontecer…"></textarea>
      <div class="row"><span class="hint">Enter registra · Shift+Enter quebra a linha</span><button class="btn primary">Registrar</button></div>
    </form>
    ${log.length ? `<ol class="timeline">${log.map(l => `<li><div class="tl-meta"><span>${fmtTime(l.at)}</span>${confirmBtn('log:' + l.id, '×', 'x')}</div><p class="tl-text">${esc(l.text)}</p></li>`).join('')}</ol>` : ''}
    <div class="section-h"><h3>Personalidades nesta sessão</h3><small>${people.length}</small></div>
    ${people.length ? `<div class="people">${people.map(n => `<button class="person" data-act="goto-npc" data-id="${esc(n.id)}"><span class="dot ${esc(n.disp)}"></span>${esc(n.name)}</button>`).join('')}</div>`
      : '<p style="color:var(--muted)">Aparecem aqui as personalidades com registros marcados nesta sessão.</p>'}
    ${places.length ? `<div class="section-h"><h3>Lugares visitados</h3><small>${places.length}</small></div>
      <div class="people">${places.map(p => `<button class="person" data-act="goto-place" data-id="${esc(p.id)}">${esc(p.name)}</button>`).join('')}</div>` : ''}
  </article>`;
}

/* --- anotações da campanha --- */
function viewNotes() {
  const q = norm(st.q.notes);
  const list = st.notes.filter(n => (!st.fCat || n.cat === st.fCat) && (!q || norm(n.title + ' ' + n.body).includes(q)))
    .sort((a, b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0) || String(a.cat).localeCompare(String(b.cat)) || byName(a, b));
  const sel = st.notes.find(n => n.id === st.sel.notes);
  const cats = NOTE_CATS.filter(c => st.notes.some(n => n.cat === c));
  const items = list.length ? list.map(n => `<li><button class="item" data-act="sel" data-kind="notes" data-id="${esc(n.id)}" aria-current="${n.id === st.sel.notes}" style="grid-template-columns:minmax(0,1fr) auto">
      <span><b>${n.pinned ? '★ ' : ''}${esc(n.title)}</b><span class="sub">${esc(n.cat)}</span></span>
      <span class="meta">${n.cat === 'Missão' && n.status ? `<span class="pill${n.status === 'concluída' ? ' ok' : n.status === 'falhou' ? ' warn' : ' gold'}">${esc(n.status)}</span>` : ''}</span></button></li>`).join('')
    : `<li class="empty">${st.notes.length ? 'Nada encontrado.' : (st.loaded.notes ? 'Sem anotações. Guarde aqui missões, itens e segredos desta campanha.' : 'Carregando…')}</li>`;
  return `<div class="work${sel ? ' has-sel' : ''}">
    <section class="pane list-pane">${listHead('notes', 'Buscar anotações…', 'new-note', '+ Nova')}
      <div class="chips">${chip('fCat', '', 'Todas')}${cats.map(c => chip('fCat', c, c)).join('')}</div>
      <ul class="items">${items}</ul></section>
    <section class="pane detail-pane">${sel ? noteDetail(sel) : '<div class="detail-empty">Escolha uma anotação.</div>'}</section>
  </div>`;
}

function noteDetail(n) {
  return `<button class="btn small ghost back" data-act="back">← Anotações</button>
  <article class="detail">
    <div class="detail-head"><div><p class="eyebrow">${esc(n.cat)}${n.cat === 'Missão' && n.status ? ' · ' + esc(n.status) : ''}</p><h2>${esc(n.title)}</h2></div>
      <div class="actions"><button class="btn small ghost" data-act="toggle-pin">${n.pinned ? '★ Fixada' : '☆ Fixar'}</button>
      ${n.cat === 'Missão' ? `<button class="btn small ghost" data-act="toggle-quest">${n.status === 'concluída' ? 'Reabrir' : 'Concluir'}</button>` : ''}
      <button class="btn small" data-act="edit-note">Editar</button>${confirmBtn('note:' + n.id)}</div></div>
    <p class="prose" style="margin-top:18px">${esc(n.body) || '<span style="color:var(--muted)">Sem texto.</span>'}</p>
    <p style="color:var(--muted);font-size:13px;margin-top:20px">Atualizada em ${fmtDate(n.updatedAt)}</p>
  </article>`;
}

/* --- mundo --- */
function worldBody() { return {mapa: viewMap, locais: viewPlaces, lore: viewLore}[st.wtab](); }

function pinHtml(p) {
  return `<button class="pin ${pinClass(p.type)}${p.id === st.sel.places ? ' sel' : ''}" data-tier="${tierOf(p)}" style="left:${+p.x}%;top:${+p.y}%" data-act="pin" data-id="${esc(p.id)}" title="${esc(p.name)} · ${esc(p.type)}"><span class="mk"></span><span class="lb">${esc(p.name)}</span></button>`;
}
function legendHtml() {
  const L = [['Capital', 'capital'], ['Cidade', 'cidade'], ['Vila', 'vila'], ['Vilarejo', 'vilarejo'], ['Castelo / fortaleza', 'forte'], ['Templo', 'templo'], ['Ruína / masmorra', 'ruina'], ['Natureza', 'natureza']];
  return `<div class="legend">${L.map(([l, c]) => `<span><span class="pin t-${c}"><span class="mk"></span></span>${l}</span>`).join('')}</div>`;
}

function viewMap() {
  const w = curWorld(); const src = mapSrc(w);
  const sel = st.places.find(p => p.id === st.sel.places);
  const placed = st.places.filter(p => p.x != null && p.y != null && p.x !== '' && p.y !== '');
  const unplaced = st.places.filter(p => !placed.includes(p)).sort(byName);
  const dims = mapDimsOf(w);
  const v = st.view[w.id];
  const pl = st.placing;
  const placingName = pl ? (pl.id ? st.places.find(p => p.id === pl.id)?.name : 'a nova localidade') : '';
  let map;
  if (!src && w.mapChunks) {
    map = `<div class="map-empty"><h3>Carregando o mapa de ${esc(w.name)}…</h3></div>`;
  } else if (!src) {
    map = `<div class="map-empty"><h3>Mapa de ${esc(w.name)}</h3>
      <p>Envie a imagem do mapa (JPG, PNG ou WebP). Depois é só clicar nele para marcar cidades, vilas, castelos e outros lugares.</p>
      <button class="btn primary" data-act="map-upload">Enviar mapa</button>
      <p style="font-size:13px">Sem mapa, você ainda pode cadastrar localidades na aba Localidades.</p></div>`;
  } else {
    const cs = dims ? `width:${dims[0]}px;height:${dims[1]}px;${v ? `transform:translate(${v.tx}px,${v.ty}px) scale(${v.s});--s:${v.s}` : 'visibility:hidden'}` : 'width:10px;height:10px;visibility:hidden';
    map = `<div class="map-tools">
        <label class="zoom-ctl" for="zoom-range"><span>Zoom</span><input type="range" id="zoom-range" min="-30" max="350" step="5" value="0" aria-label="Nível de zoom"><span class="zoom" id="zoom-label">100%</span></label>
        <button class="btn small ghost" data-act="labels">${st.labels ? 'Ocultar nomes' : 'Mostrar nomes'}</button>
        <button class="btn small ghost" data-act="lod" title="Quando ligado, lugares menores só aparecem ao aproximar">${st.lod ? 'Detalhe pelo zoom: ligado' : 'Mostrando todos os lugares'}</button>
        <span class="spacer"></span>
        <button class="btn small primary" data-act="place-new">+ Localidade no mapa</button>
        <button class="btn small ghost" data-act="map-upload">Trocar mapa</button></div>
      ${pl ? `<div class="placing-bar" role="status"><span>Clique no mapa para posicionar <b>${esc(placingName)}</b>. Você ainda pode arrastar e dar zoom para achar o ponto.</span><button class="btn small" data-act="place-cancel">Cancelar</button></div>` : ''}
      <div class="map-view${pl ? ' placing' : ''}${st.labels ? '' : ' nolabels'}" id="map-view" tabindex="0" aria-label="Mapa de ${esc(w.name)}. Setas movem, mais e menos dão zoom, zero enquadra.">
        <div class="map-canvas" id="map-canvas" style="${cs}">
          <img id="map-img" src="${esc(src)}" alt="" draggable="false">
          ${placed.map(pinHtml).join('')}
        </div>
        <div class="map-ctl zoom-btns">
          <button type="button" data-act="mz" data-z="in" aria-label="Aproximar">+</button>
          <button type="button" data-act="mz" data-z="out" aria-label="Afastar">−</button>
          <button type="button" data-act="mz" data-z="fit" aria-label="Enquadrar o mapa inteiro" title="Enquadrar o mapa inteiro">⤢</button>
        </div>
        <div class="map-ctl dpad" aria-label="Mover o mapa">
          <button type="button" class="up" data-act="mpan" data-dx="0" data-dy="1" aria-label="Mover para cima">▲</button>
          <button type="button" class="left" data-act="mpan" data-dx="1" data-dy="0" aria-label="Mover para a esquerda">◀</button>
          <button type="button" class="mid" data-act="mz" data-z="center" aria-label="Centralizar" title="${sel && sel.x != null && sel.x !== '' ? 'Centralizar em ' + esc(sel.name) : 'Centralizar'}">●</button>
          <button type="button" class="right" data-act="mpan" data-dx="-1" data-dy="0" aria-label="Mover para a direita">▶</button>
          <button type="button" class="down" data-act="mpan" data-dx="0" data-dy="-1" aria-label="Mover para baixo">▼</button>
        </div>
      </div>
      <p class="map-hint">Roda do mouse ou pinça: zoom · Arrastar: mover · Duplo clique: aproximar · Lugares menores aparecem ao aproximar · No teclado: setas movem, + e − dão zoom, 0 enquadra</p>
      ${legendHtml()}
      ${unplaced.length ? `<div class="unplaced">Ainda sem posição no mapa (clique para marcar):<div class="people">${unplaced.map(p => `<button class="person" data-act="place-set" data-id="${esc(p.id)}">${esc(p.name)} <span class="type-badge">${esc(p.type)}</span></button>`).join('')}</div></div>` : ''}`;
  }
  const side = sel ? placeDetail(sel, true)
    : `<div class="side-empty"><h3>${placed.length ? 'Escolha um lugar no mapa' : 'Nenhum lugar marcado'}</h3><p>${src ? 'Clique em um marcador para ver a ficha do lugar. Use <b>+ Localidade no mapa</b> para cadastrar e marcar ao mesmo tempo.' : 'Depois de enviar o mapa, os lugares aparecem aqui.'}</p></div>`;
  return `<div class="map-layout"><section class="pane">${map}</section><section class="pane">${side}</section></div>`;
}

function viewPlaces() {
  const list = placesFiltered(), sel = st.places.find(p => p.id === st.sel.places);
  const types = PLACE_TYPES.map(([t]) => t).filter(t => st.places.some(p => p.type === t));
  const byId = Object.fromEntries(st.places.map(p => [p.id, p]));
  const items = list.length ? list.map(p => `<li><button class="item" data-act="sel" data-kind="places" data-id="${esc(p.id)}" aria-current="${p.id === st.sel.places}" style="grid-template-columns:18px minmax(0,1fr) auto">
      <span class="pin ${pinClass(p.type)}" style="position:static;transform:none;pointer-events:none;margin-top:5px"><span class="mk"></span></span>
      <span><b>${esc(p.name)}</b><span class="sub">${esc([p.type, byId[p.parent]?.name || p.region].filter(Boolean).join(' · '))}</span></span>
      <span class="meta">${p.x != null && p.x !== '' ? '' : '<span class="pill" title="Sem posição no mapa">sem mapa</span>'}</span></button></li>`).join('')
    : `<li class="empty">${st.places.length ? 'Nada encontrado.' : (st.loaded.places ? `Nenhuma localidade em ${esc(curWorld()?.name)} ainda. Cadastre cidades, vilas, castelos e outros lugares importantes.` : 'Carregando…')}</li>`;
  return `<div class="work${sel ? ' has-sel' : ''}">
    <section class="pane list-pane">${listHead('places', 'Buscar lugar, região, governante…', 'new-place', '+ Nova')}
      <div class="chips">${chip('fType', '', 'Todos')}${types.map(t => chip('fType', t, t)).join('')}</div>
      <ul class="items">${items}</ul></section>
    <section class="pane detail-pane">${sel ? placeDetail(sel, false) : '<div class="detail-empty">Escolha uma localidade para ver a ficha.</div>'}</section>
  </div>`;
}

function placeDetail(p, compact) {
  const byId = Object.fromEntries(st.places.map(x => [x.id, x]));
  const parent = byId[p.parent];
  const children = st.places.filter(x => x.parent === p.id).sort(byName);
  const hasPos = p.x != null && p.x !== '';
  const fact = (l, v) => v ? `<div><dt>${l}</dt><dd>${v}</dd></div>` : '';

      <button type="button" class="wide" data-act="dice-quick" data-expr="2d20kh1">Vantagem</button><button type="button" class="wide" data-act="dice-quick" data-expr="2d20kl1">Desvantagem</button></div>
    ${d.err ? `<p class="err">${esc(d.err)}</p>` : ''}
    ${d.last ? `<div class="dice-result"><div class="total${d.last.crit ? ' crit' : d.last.fumble ? ' fumble' : ''}">${d.last.total}</div><div class="break">${esc(d.last.detail)}${d.last.crit ? ' · 20 natural!' : d.last.fumble ? ' · 1 natural' : ''}</div></div>` : ''}
    ${d.hist.length > 1 ? `<ul class="dice-hist">${d.hist.slice(1, 12).map(h => `<li><span>${esc(h.expr)}</span><b>${h.total}</b></li>`).join('')}</ul>` : ''}
  </section>` : ''}`);
}

/* ---------- exportar / importar ---------- */
async function exportData() {
  const out = {app: 'grimorio', version: 2, exportedAt: nowIso(), worlds: [], campaigns: []};
  let camps = st.campaigns, worlds = st.worlds;
  if (st.screen === 'campaign') { camps = st.campaigns.filter(c => c.id === st.cid); worlds = [worldOf(curCamp())].filter(Boolean); }
  else if (st.screen === 'world') { camps = []; worlds = [curWorld()].filter(Boolean); }
  for (const w of worlds) {
    const e = {world: w, places: await store.list(`worlds/${w.id}/places`), lore: await store.list(`worlds/${w.id}/lore`)};
    if (store.mode === 'local') e.mapData = lsGet('grimorio-mapa-' + w.id);
    out.worlds.push(e);
  }
  for (const c of camps) {
    const e = {campaign: c};
    for (const k of ['npcs', 'sessions', 'notes', 'placeNotes']) e[k] = await store.list(`campaigns/${c.id}/${k}`);
    out.campaigns.push(e);
  }
  const label = st.screen === 'campaign' ? curCamp()?.name : st.screen === 'world' ? curWorld()?.name : 'tudo';
  const filename = `grimorio-${norm(label).replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '')}-${new Date().toLocaleDateString('en-CA')}.json`;
  const json = JSON.stringify(out, null, 2);
  let dl = null;
  try { dl = window.claude?.use ? await window.claude.use('downloads') : null; } catch {}
  if (dl) { try { await dl.save({filename, data: json}); } catch { toast('O download não foi concluído.'); } return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([json], {type: 'application/json'})); a.download = filename;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
async function importData(file) {
  let data; try { data = JSON.parse(await file.text()); } catch { return toast('Esse arquivo não é um backup válido do Grimório.'); }
  if (data?.app !== 'grimorio' || !Array.isArray(data.campaigns)) return toast('Esse arquivo não é um backup válido do Grimório.');
  const worldMap = {}; let nw = 0, nc = 0;
  for (const e of (data.worlds || [])) {
    const src = e.world || {}; const same = st.worlds.find(w => norm(w.name) === norm(src.name));
    const wid = same ? same.id : (src.id && !st.worlds.some(w => w.id === src.id) ? src.id : uid());
    worldMap[src.id] = wid;
    if (!same) { const d = strip(src); if (store.mode === 'local') delete d.mapAsset; if (!await save('worlds', wid, d)) return; nw++; }
    if (e.mapData && store.mode === 'local' && !lsGet('grimorio-mapa-' + wid)) lsSet('grimorio-mapa-' + wid, e.mapData);
    for (const k of ['places', 'lore']) {
      const existing = await store.list(`worlds/${wid}/${k}`); const names = new Set(existing.map(x => norm(x.name || x.title)));
      for (const d of (e[k] || [])) if (!names.has(norm(d.name || d.title)) && !existing.some(x => x.id === d.id)) await store.put(`worlds/${wid}/${k}`, d.id || uid(), strip(d));
    }
    if (store.mode === 'firebase' && !same && e.map?.length) for (const d of e.map) await store.put(`worlds/${wid}/map`, d.id, strip(d));
  }
  for (const e of data.campaigns) {
    const cid = uid(); const c = strip(e.campaign || {});
    c.worldId = worldMap[c.worldId] || (st.worlds.some(w => w.id === c.worldId) ? c.worldId : worldOf(null)?.id);
    if (st.campaigns.some(x => x.name === c.name)) c.name += ' (importada)';
    if (!await save('campaigns', cid, c)) return;
    for (const k of ['npcs', 'sessions', 'notes', 'placeNotes']) for (const d of (e[k] || [])) await store.put(`campaigns/${cid}/${k}`, d.id || uid(), strip(d));
    nc++;
  }
  const parts = [nw && `${nw} mundo(s)`, nc && `${nc} campanha(s)`].filter(Boolean);
  toast(parts.length ? parts.join(' e ') + ' importado(s).' : 'Dados do mundo mesclados.');
}

/* ---------- ações ---------- */
async function addEntry(kind) {
  if (kind === 'npc') {
    const n = st.npcs.find(x => x.id === st.sel.npcs); if (!n) return;
    const ta = document.getElementById('entry-' + n.id), text = ta.value.trim(); if (!text) return ta.focus();
    const s = document.getElementById('entry-s-' + n.id).value;
    if (await save(sub('npcs'), n.id, {...strip(n), entries: [...clone(n.entries || []), {id: uid(), text, session: s ? +s : null, at: nowIso()}], updatedAt: nowIso()})) { ta.value = ''; ta.focus(); }
  } else if (kind === 'log') {
    const s = st.sessions.find(x => x.id === st.sel.sessions); if (!s) return;
    const ta = document.getElementById('log-' + s.id), text = ta.value.trim(); if (!text) return ta.focus();
    if (await save(sub('sessions'), s.id, {...strip(s), log: [...clone(s.log || []), {id: uid(), text, at: nowIso()}], updatedAt: nowIso()})) { ta.value = ''; ta.focus(); }
  } else if (kind === 'pentry') {
    const p = st.places.find(x => x.id === st.sel.places); if (!p) return;
    const ta = document.getElementById('pentry-' + p.id), text = ta.value.trim(); if (!text) return ta.focus();
    if (await save(wsub('places'), p.id, {...strip(p), entries: [...clone(p.entries || []), {id: uid(), text, at: nowIso()}], updatedAt: nowIso()})) { ta.value = ''; ta.focus(); }
  } else if (kind === 'pnote') {
    const p = st.places.find(x => x.id === st.sel.places); if (!p) return;
    const ta = document.getElementById('pnote-' + p.id), text = ta.value.trim(); if (!text) return ta.focus();
    const s = document.getElementById('pnote-s-' + p.id).value;
    const pn = st.pnotes.find(x => x.id === p.id);
    const entries = [...clone(pn?.entries || []), {id: uid(), text, session: s ? +s : null, at: nowIso()}];
    if (await save(sub('placeNotes'), p.id, {placeName: p.name, entries, updatedAt: nowIso()})) { ta.value = ''; ta.focus(); }
  }
}

let confirmT;
async function handleDelete(key) {
  if (st.confirm !== key) { st.confirm = key; clearTimeout(confirmT); confirmT = setTimeout(() => { st.confirm = null; render(); }, 4000); return render(); }
  st.confirm = null; clearTimeout(confirmT);
  const i = key.indexOf(':'), type = key.slice(0, i), id = key.slice(i + 1);
  if (type === 'camp') await deleteCampaign(id);
  else if (type === 'world') await deleteWorld(id);
  else if (type === 'npc') { if (await remove(sub('npcs'), id)) st.sel.npcs = null; }
  else if (type === 'session') { if (await remove(sub('sessions'), id)) st.sel.sessions = null; }
  else if (type === 'note') { if (await remove(sub('notes'), id)) st.sel.notes = null; }
  else if (type === 'place') { if (await remove(wsub('places'), id)) st.sel.places = null; }
  else if (type === 'lore') { if (await remove(wsub('lore'), id)) st.sel.lore = null; }
  else if (type === 'entry') { const n = st.npcs.find(x => x.id === st.sel.npcs); if (n) await save(sub('npcs'), n.id, {...strip(n), entries: (n.entries || []).filter(e => e.id !== id), updatedAt: nowIso()}); }
  else if (type === 'log') { const s = st.sessions.find(x => x.id === st.sel.sessions); if (s) await save(sub('sessions'), s.id, {...strip(s), log: (s.log || []).filter(l => l.id !== id)}); }
  else if (type === 'pentry') { const p = st.places.find(x => x.id === st.sel.places); if (p) await save(wsub('places'), p.id, {...strip(p), entries: (p.entries || []).filter(e => e.id !== id), updatedAt: nowIso()}); }
  else if (type === 'pnote') { const pn = st.pnotes.find(x => x.id === st.sel.places); if (pn) await save(sub('placeNotes'), pn.id, {...strip(pn), entries: (pn.entries || []).filter(e => e.id !== id), updatedAt: nowIso()}); }
  render();
}

function gotoPlace(id, onMap) {
  const fromWorld = st.screen === 'world' || st.tab === 'world';
  if (inCampaign()) st.tab = 'world';
  st.wtab = onMap || (fromWorld && st.wtab === 'mapa') ? 'mapa' : 'locais';
  st.sel.places = id; window.scrollTo(0, 0); render();
  if (st.wtab === 'mapa') { const p = st.places.find(x => x.id === id); if (p) requestAnimationFrame(() => centerOn(p)); }
}

document.addEventListener('click', async ev => {
  if (st.placing && ev.target.closest?.('#map-canvas') && !ev.target.closest('[data-act="pin"]')) { ev.preventDefault(); return placeAt(ev); }
  if (!st.placing && ev.target.closest?.('#map-view') && !ev.target.closest('.pin, .map-ctl')) {
    if (st.sel.places) { st.sel.places = null; st.confirm = null; render(); }
    return;
  }
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act;
  if (act === 'modal-bg') { if (ev.target === b) closeForm(); return; }
  if (act === 'modal-close') return closeForm();
  if (act === 'dice-toggle') { st.dice.open = !st.dice.open; renderDice(); if (st.dice.open) $('#dice-expr')?.focus(); return; }
  if (act === 'dice-quick') { $('#dice-expr').value = b.dataset.expr; return doRoll(b.dataset.expr); }
  if (act === 'login') return login();
  if (act === 'logout') return firebase.auth().signOut();
  if (act === 'editors') return editorsForm();
  if (act === 'seed') return seedFromPublished();
  if (act === 'export') return exportData();
  if (act === 'import') return $('#import-file').click();
  if (act === 'go-picker') return goPicker();
  if (act === 'pick-camp') return openCampaign(b.dataset.id);
  if (act === 'open-world') return openWorld(b.dataset.id);
  if (act === 'new-world') return worldForm(null);
  if (act === 'edit-world') return worldForm(st.worlds.find(w => w.id === b.dataset.id));
  if (act === 'new-camp') return campaignForm(null);
  if (act === 'edit-camp') return campaignForm(st.campaigns.find(c => c.id === b.dataset.id));
  if (act === 'sample') return createSample();
  if (act === 'del') return handleDelete(b.dataset.key);
  if (act === 'tab') { st.tab = b.dataset.tab; st.placing = null; return render(); }
  if (act === 'wtab') { st.wtab = b.dataset.tab; st.placing = null; return render(); }
  if (act === 'sel') { st.sel[b.dataset.kind] = b.dataset.id; st.confirm = null; render(); if (matchMedia('(max-width:860px)').matches) window.scrollTo(0, 0); return; }
  if (act === 'back') { const k = st.screen === 'world' || st.tab === 'world' ? (st.wtab === 'lore' ? 'lore' : 'places') : st.tab; st.sel[k] = null; return render(); }
  if (act === 'filter') { st[b.dataset.key] = b.dataset.val; return render(); }
  if (act === 'new-npc') return npcForm(null);
  if (act === 'edit-npc') return npcForm(st.npcs.find(n => n.id === st.sel.npcs));
  if (act === 'new-session') return sessionForm(null);
  if (act === 'edit-session') return sessionForm(st.sessions.find(s => s.id === st.sel.sessions));
  if (act === 'new-note') return noteForm(null);
  if (act === 'edit-note') return noteForm(st.notes.find(n => n.id === st.sel.notes));
  if (act === 'new-place') return placeForm(null);
  if (act === 'edit-place') return placeForm(st.places.find(p => p.id === st.sel.places));
  if (act === 'new-lore') return loreForm(null);
  if (act === 'edit-lore') return loreForm(st.lore.find(n => n.id === st.sel.lore));
  if (act === 'goto-npc') { st.tab = 'npcs'; st.sel.npcs = b.dataset.id; window.scrollTo(0, 0); return render(); }
  if (act === 'goto-place') return gotoPlace(b.dataset.id, false);
  if (act === 'show-on-map') return gotoPlace(st.sel.places, true);
  if (act === 'pin') { st.sel.places = b.dataset.id; st.confirm = null; return render(); }
  if (act === 'goto-session') { const s = st.sessions.find(x => String(x.num) === String(b.dataset.num)); if (s) { st.tab = 'sessions'; st.sel.sessions = s.id; window.scrollTo(0, 0); render(); } else toast('Essa sessão não está registrada.'); return; }
  if (act === 'map-upload') return $('#map-file').click();
  if (act === 'mz') { const z = b.dataset.z; if (z === 'in') zoomAt(1.5); else if (z === 'out') zoomAt(1 / 1.5); else if (z === 'fit') fitView();
    else { const p = st.places.find(x => x.id === st.sel.places); if (p && p.x != null && p.x !== '') centerOn(p, 1); else { const v = V(), d = mapDimsOf(curWorld()), bx = viewBox(); if (v && d && bx) { v.tx = (bx[0] - d[0] * v.s) / 2; v.ty = (bx[1] - d[1] * v.s) / 2; clampView(v); applyView(); } } } return; }
  if (act === 'mpan') { const bx = viewBox(); if (bx) panBy(+b.dataset.dx * bx[0] * .3, +b.dataset.dy * bx[1] * .3); return; }
  if (act === 'lod') { st.lod = !st.lod; lsSet('grimorio-lod', st.lod ? '1' : '0'); return render(); }
  if (act === 'labels') { st.labels = !st.labels; lsSet('grimorio-rotulos', st.labels ? '1' : '0'); return render(); }
  if (act === 'place-new') { st.placing = {new: true}; return render(); }
  if (act === 'place-set') { st.wtab = 'mapa'; if (inCampaign()) st.tab = 'world'; st.placing = {id: b.dataset.id}; st.sel.places = b.dataset.id; window.scrollTo(0, 0); return render(); }
  if (act === 'place-cancel') { st.placing = null; return render(); }
  if (act === 'toggle-pin' || act === 'toggle-quest') {
    const n = st.notes.find(x => x.id === st.sel.notes); if (!n) return;
    const patch = act === 'toggle-pin' ? {pinned: !n.pinned} : {status: n.status === 'concluída' ? 'aberta' : 'concluída'};
    return save(sub('notes'), n.id, {...strip(n), ...patch, updatedAt: nowIso()});
  }
});

document.addEventListener('submit', async ev => {
  const f = ev.target.closest('[data-form]'); if (!f) return;
  ev.preventDefault();
  const k = f.dataset.form;
  if (k === 'modal') { const m = modalState; const btn = f.querySelector('.btn.primary'); btn.disabled = true; const ok = await m.onSubmit(readForm()); if (ok !== false) closeForm(); else btn.disabled = false; render(); }
  else if (k === 'npc-entry') addEntry('npc');
  else if (k === 'session-log') addEntry('log');
  else if (k === 'place-entry') addEntry('pentry');
  else if (k === 'place-note') addEntry('pnote');
  else if (k === 'dice') doRoll($('#dice-expr').value);
});

document.addEventListener('input', ev => {
  const q = ev.target.dataset?.q; if (q) { st.q[q] = ev.target.value; render(); }
});
document.addEventListener('change', ev => {
  if (ev.target.id === 'npc-sort') { st.npcSort = ev.target.value; render(); }
  if (ev.target.id === 'lore-period') { st.fPeriod = ev.target.value; render(); }
  if (ev.target.id === 'lore-sort') { st.loreSort = ev.target.value; render(); }
  if (ev.target.id === 'import-file') { const file = ev.target.files[0]; ev.target.value = ''; if (file) importData(file); }
  if (ev.target.id === 'map-file') { const file = ev.target.files[0]; ev.target.value = ''; if (file) uploadMap(file); }
});
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape') { if (modalState) closeForm(); else if (st.placing) { st.placing = null; render(); } else if (st.dice.open) { st.dice.open = false; renderDice(); } return; }
  const t = ev.target;
  if (t.id === 'map-view' && V()) {
    const bx = viewBox(), k = ev.key;
    if (k === 'ArrowLeft') panBy(bx[0] * .15, 0); else if (k === 'ArrowRight') panBy(-bx[0] * .15, 0);
    else if (k === 'ArrowUp') panBy(0, bx[1] * .15); else if (k === 'ArrowDown') panBy(0, -bx[1] * .15);
    else if (k === '+' || k === '=') zoomAt(1.25); else if (k === '-' || k === '_') zoomAt(0.8); else if (k === '0') fitView();
    else return;
    ev.preventDefault(); return;
  }
  if (ev.key === 'Enter' && t.matches?.('textarea[id^="log-"]') && !ev.shiftKey) { ev.preventDefault(); addEntry('log'); }
  if (ev.key === 'Enter' && (ev.ctrlKey || ev.metaKey)) {
    if (t.matches?.('textarea[id^="entry-"]')) { ev.preventDefault(); addEntry('npc'); }
    if (t.matches?.('textarea[id^="pentry-"]')) { ev.preventDefault(); addEntry('pentry'); }
    if (t.matches?.('textarea[id^="pnote-"]')) { ev.preventDefault(); addEntry('pnote'); }
  }
});

/* ---------- login e editores (Firebase) ---------- */
function initAuth() {
  document.body.classList.add('ro');
  firebase.auth().getRedirectResult().catch(() => {});
  firebase.auth().onAuthStateChanged(async u => {
    st.user = u ? {email: u.email, name: u.displayName} : null; st.canEdit = false; st.editors = [];
    if (u) {
      try { const d = await store.fs.doc('config/editors').get(); st.canEdit = true; st.editors = d.exists ? (d.data().emails || []) : []; }
      catch { st.canEdit = false; }
    }
    document.body.classList.toggle('ro', !st.canEdit);
    render();
  });
}
async function login() {
  const auth = firebase.auth(), prov = new firebase.auth.GoogleAuthProvider();
  try { await auth.signInWithPopup(prov); }
  catch (e) {
    if (['auth/popup-blocked', 'auth/operation-not-supported-in-this-environment', 'auth/cancelled-popup-request'].includes(e?.code)) return auth.signInWithRedirect(prov);
    if (e?.code === 'auth/unauthorized-domain') return toast('Este endereço ainda não foi autorizado no Firebase (Authentication → Domínios autorizados).');
    if (e?.code !== 'auth/popup-closed-by-user') toast('Não foi possível entrar. Tente de novo.');
  }
}
function editorsForm() {
  openForm({
    title: 'Quem pode editar', submit: 'Salvar',
    intro: 'Qualquer pessoa pode ver o Grimório. Para editar, a pessoa entra com uma conta Google cujo e-mail esteja nesta lista. Só o administrador pode mudar a lista.',
    fields: [{id: 'emails', label: 'E-mails autorizados (um por linha)', type: 'textarea', full: true, value: (st.editors || []).join('\n'), ph: 'amigo@gmail.com'}],
    onSubmit: async v => {
      const emails = uniq(v.emails.split(/[\s,;]+/).map(e => e.trim().toLowerCase()).filter(e => /@/.test(e)));
      try { await store.fs.doc('config/editors').set({emails, updatedAt: nowIso()}); st.editors = emails; toast('Lista de editores salva.'); return true; }
      catch (e) { toast(e?.code === 'permission-denied' ? 'Só o administrador pode mudar a lista de editores.' : 'Não foi possível salvar.'); return false; }
    }
  });
}
async function seedFromPublished() {
  let data;
  try { const r = await fetch('../data/grimorio.json', {cache: 'no-cache'}); data = await r.json(); } catch { return toast('Não encontrei os dados publicados no repositório.'); }
  if (data?.app !== 'grimorio') return toast('Os dados publicados não estão no formato esperado.');
  toast('Copiando os dados publicados…');
  try {
    for (const e of data.worlds || []) {
      const w = e.world; await store.put('worlds', w.id, strip(w));
      for (const k of ['places', 'lore']) for (const d of e[k] || []) await store.put(`worlds/${w.id}/${k}`, d.id, strip(d));
    }
    for (const e of data.campaigns || []) {
      const c = e.campaign; await store.put('campaigns', c.id, strip(c));
      for (const k of ['npcs', 'sessions', 'notes', 'placeNotes']) for (const d of e[k] || []) await store.put(`campaigns/${c.id}/${k}`, d.id, strip(d));
    }
    toast('Pronto. Os dados agora estão no banco compartilhado.');
  } catch (e) { failMsg(e); }
}

/* ---------- início ---------- */
async function boot() {
  let db = null;
  if (window.claude?.use) { try { db = await window.claude.use('db'); } catch { db = null; } }
  if (window.FIREBASE_CONFIG && window.firebase) { try { store = fbStore(); initAuth(); } catch (e) { console.error(e); store = null; } }
  if (!store) store = db ? dbStore(db) : localStore();
  await loadPublished();
  let worldsReady = false, campsReady = false, creating = false;
  const done = () => { if (worldsReady && campsReady) st.ready = true; render(); };
  store.listen('worlds', async (docs, meta) => {
    st.worlds = docs;
    if (!docs.length && !meta?.fromCache && !creating && store.mode !== 'firebase') { creating = true; await save('worlds', 'ethru', {name: 'Ethrü', desc: 'O mundo criado entre amigos, inspirado inicialmente em D&D.', createdAt: nowIso()}); return; }
    if (docs.length || (store.mode === 'firebase' && !meta?.fromCache)) worldsReady = true;
    if (st.screen === 'world' && !docs.some(w => w.id === st.wid) && !meta?.fromCache) goPicker();
    done();
  }, () => { worldsReady = true; done(); });
  store.listen('campaigns', (docs, meta) => {
    st.campaigns = docs; campsReady = true;
    if (st.screen === 'campaign') {
      if (!docs.some(c => c.id === st.cid) && !meta?.fromCache) return goPicker();
      const w = worldOf(curCamp()); if (w && w.id !== st.wid) subWorld(w.id);
    }
    done();
  }, () => { campsReady = true; done(); });
  render();
}
render(); renderDice(); boot();
