name: Backup do Firebase

on:
  schedule:
    # dias 1 e 16 de cada mês (a cada ~15 dias), 06:17 no horário de São Paulo
    - cron: '17 9 1,16 * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: backup-firebase
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Baixar os dados do Firestore
        run: node tools/backup-firestore.mjs "$RUNNER_TEMP/novo.json"

      - name: Guardar no branch backups (mantém só os 2 mais recentes)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BK="$RUNNER_TEMP/bk"
          mkdir -p "$BK/backups"
          if git ls-remote --exit-code --heads origin backups >/dev/null 2>&1; then
            git fetch --depth=1 origin backups
            git archive FETCH_HEAD backups | tar -x -C "$BK" || true
          fi
          cp "$RUNNER_TEMP/novo.json" "$BK/backups/grimorio-$(date -u +%Y-%m-%d_%H%M).json"
          ls -1 "$BK"/backups/grimorio-*.json | sort | head -n -2 | xargs -r rm -f
          cat > "$BK/README.md" <<'TXT'
          # Backups do Grimório

          Cópias do banco do Firebase (Firestore) feitas automaticamente nos dias 1 e 16 de cada mês.
          Só os 2 backups mais recentes ficam guardados: este branch é recriado a cada backup, sem histórico.

          Para restaurar: baixe o arquivo `.json`, abra o Grimório com a conta de administrador e use **Importar**.
          TXT
          sed -i 's/^          //' "$BK/README.md"
          cd "$BK"
          git init -q -b backups
          git config user.name "Backup do Grimório"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Backup de $(date -u +%Y-%m-%d)"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" backups
          echo "Backups guardados:"; ls -1 backups
