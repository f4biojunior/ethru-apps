name: Atualizar linha do tempo

on:
  schedule:
    # a cada hora, no minuto 7
    - cron: '7 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: linha-do-tempo
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Ler a planilha da TimelineJS
        run: node tools/atualizar-linha-do-tempo.mjs

      - name: Salvar no repositório se mudou
        run: |
          if git diff --quiet -- data/linha-do-tempo.json; then
            echo "Sem mudanças."
            exit 0
          fi
          git config user.name "Linha do tempo de Ethrü"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/linha-do-tempo.json
          git commit -m "Atualiza eras e eventos da linha do tempo"
          git pull --rebase origin main
          git push origin HEAD:main
